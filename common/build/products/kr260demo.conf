PRODUCT="kr260demo"
PRODUCT_ALIASES="kr260demo kr260"
PROJECT_PREFIX="KR260Demo"

APU_REPO_DIR="KR260Demo_APU"
APU_LOCAL_DIR_VARIABLE="APU_RPU_CTL_LOCAL_DIR"
PL_REPO_DIR="KR260Demo_PL"
PL_XSA_BASENAME="KR260Demo_PL.xsa"
SDT_MODE="board_dts"
SDT_VALUE_REL="zynqmp-smk-k26-reva"

RPU_REPO_DIR="KR260Demo_RPU"
RPU_HEADER_SCRIPT_REL="scripts/gen_openamp_channel_headers.sh"
RPU_PLATFORM_SCRIPT_REL="scripts/create_platform_from_xsa.py"

MACHINE="kr260demo"
MCONF_TEMPLATE_REL="yocto-build/sources/meta-kria/conf/machineyaml/k26-smk-kr-sdt.yaml"
MCONF_DOMAIN_REL="yocto-build/sources/meta-monutchee/meta-zynqmp-addon/recipes-bsp/domainyaml/openamp-overlay-zynqmp-v2026_1.yaml"
DEFAULT_IMAGE_TARGET="kr260demo-image"

# Order for "mnc all build". mconf precedes RPU because RPU_DEPENDS_ON_MCONF
# defaults to true here: make_RPU.sh consumes the mconf artifact, and
# publishing mconf afterwards would prune the rpu artifact. No HLS stage:
# this product has no Vitis HLS components.
MNC_CHAIN="PL mconf RPU yocto"
